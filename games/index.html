<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Games Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎮 Retro Games Portal</h1>
    <p>Play classics and new adventures!</p>
  </header>

  <main id="games-container">
    <!-- Example Game Card -->
    <div class="game-card" data-url="https://example.com/game1">
      <img src="images/game1.png" alt="Game 1">
      <p>Space Invaders</p>
    </div>

    <div class="game-card" data-url="https://example.com/game2">
      <img src="images/game2.png" alt="Game 2">
      <p>Flappy Bird</p>
    </div>

    <div class="game-card" data-url="https://example.com/game3">
      <img src="images/game3.png" alt="Game 3">
      <p>Snake Retro</p>
    </div>
  </main>

  <footer>
    <p>© 2025 Retro Games Portal</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
