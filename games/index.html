    <h1>🎮 Play classic arcade games in a cosmic style!</h1>

  <main>
    <div class="games-grid">
      <a class="game-card" href="files/flappy-game.html">

          <h2>Flappy Game</h2>
          <p>Guide your pixel bird through neon pipes in space!</p>

      <a class="game-card" href="files/word-jumble.html">

        <div class="game-info">
          <h2>Word Jumble</h2>

        </div>
