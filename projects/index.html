<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Portfolio | Projects Showcase</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        space: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        space: {
                            dark: '#030014',
                            light: '#0f0c29',
                            accent: '#00f2fe',
                            purple: '#4facfe'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Styles & Custom Cursor Hiding */
        body {
            margin: 0;
            padding: 0;
            background-color: #030014;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            /* Hide default cursor on desktop */
            @media (pointer: fine) {
                cursor: none;
            }
        }
        
        /* Interactive elements should also hide default cursor if custom is active */
        @media (pointer: fine) {
            a, button, input, select, textarea {
                cursor: none;
            }
        }

        /* Animated Star Background */
        .stars, .twinkling, .clouds {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .stars {
            background: #000 url('https://raw.githubusercontent.com/frontend-joe/css-backgrounds/main/stars.png') repeat top center;
            z-index: -3;
        }

        .twinkling {
            background: transparent url('https://raw.githubusercontent.com/frontend-joe/css-backgrounds/main/twinkling.png') repeat top center;
            z-index: -2;
            animation: move-twink-back 200s linear infinite;
        }

        @keyframes move-twink-back {
            from {background-position: 0 0;}
            to {background-position: -10000px 5000px;}
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 242, 254, 0.2);
            border-color: rgba(0, 242, 254, 0.4);
        }

        /* Custom Cursor Elements */
        #custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 30px;
            height: 30px;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
            display: none; /* Hidden by default, shown via JS on desktop */
        }

        @media (pointer: fine) {
            #custom-cursor {
                display: block;
            }
        }

        .cursor-rocket {
            width: 100%;
            height: 100%;
            /* Rotating to point up-left natively */
            transform: rotate(-45deg); 
            filter: drop-shadow(0 0 5px #00f2fe);
        }

        /* Particle Trail */
        .particle {
            position: fixed;
            pointer-events: none;
            width: 4px;
            height: 4px;
            background: #00f2fe;
            border-radius: 50%;
            z-index: 9998;
            animation: particle-fade 0.8s ease-out forwards;
            box-shadow: 0 0 8px #00f2fe, 0 0 15px #4facfe;
        }

        @keyframes particle-fade {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.1) translate(var(--tx), var(--ty));
            }
        }
        
        /* Glowing Text Utility */
        .text-glow {
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5), 0 0 20px rgba(79, 172, 254, 0.3);
        }
    </style>
</head>
<body class="relative min-h-screen antialiased selection:bg-space-accent selection:text-space-dark">

    <!-- Background Elements -->
    <div class="fixed inset-0 pointer-events-none">
        <div class="stars"></div>
        <div class="twinkling"></div>
        <!-- Gradient overlay to blend with bg color -->
        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-space-dark z-[-1]"></div>
    </div>

    <!-- Custom Cursor -->
    <div id="custom-cursor">
        <svg class="cursor-rocket" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2.5C12 2.5 6 7 6 14C6 15.6569 7.34315 17 9 17H15C16.6569 17 18 15.6569 18 14C18 7 12 2.5 12 2.5Z" fill="#E0E7FF" stroke="#00f2fe" stroke-width="1.5"/>
            <path d="M9 17L7.5 21.5H16.5L15 17" fill="#4facfe" stroke="#00f2fe" stroke-width="1.5" stroke-linejoin="round"/>
            <circle cx="12" cy="11" r="2" fill="#030014" stroke="#00f2fe"/>
            <path d="M12 21.5V23.5" stroke="#FF5722" stroke-width="2" stroke-linecap="round"/>
            <path d="M10 21.5V22.5" stroke="#FFC107" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M14 21.5V22.5" stroke="#FFC107" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
    </div>

    <!-- Main Content -->
    <div class="relative z-10 container mx-auto px-6 py-20 min-h-screen flex flex-col items-center">
        
        <!-- Header Section -->
        <header class="text-center mb-20 max-w-3xl mx-auto">
            <div class="inline-block mb-4 px-4 py-1 rounded-full border border-space-accent/30 bg-space-accent/10 backdrop-blur-sm text-space-accent font-space text-sm tracking-widest uppercase">
                Mission Control Activated
            </div>
            <h1 class="text-5xl md:text-7xl font-orbitron font-black mb-6 text-transparent bg-clip-text bg-gradient-to-r from-space-accent to-space-purple text-glow">
                My Projects Universe
            </h1>
            <p class="text-gray-300 font-space text-lg md:text-xl leading-relaxed">
                Exploring the frontend cosmos. Building and maintaining stellar web applications. 
                Data successfully syncing from <code class="bg-white/10 px-2 py-1 rounded text-space-accent">data.json</code>.
            </p>
        </header>

        <!-- Loading State -->
        <div id="loader" class="flex flex-col items-center justify-center space-y-4 my-10">
            <div class="w-12 h-12 border-4 border-space-accent border-t-transparent rounded-full animate-spin"></div>
            <p class="font-orbitron tracking-widest text-space-accent animate-pulse">ESTABLISHING CONNECTION...</p>
        </div>

        <!-- Projects Grid Container -->
        <div id="projects-grid" class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 hidden">
            <!-- Project Cards will be injected here by JavaScript -->
        </div>

        <footer class="mt-24 text-center text-gray-500 font-space text-sm border-t border-white/10 pt-8 w-full">
            <p>&copy; <span id="year"></span> Cosmic Portfolio. All systems operational.</p>
        </footer>

    </div>

    <!-- Template for Project Card -->
    <template id="project-card-template">
        <a href="#" target="_blank" class="glass-card rounded-2xl overflow-hidden group block relative">
            <!-- Glow effect on hover -->
            <div class="absolute inset-0 bg-gradient-to-br from-space-accent/20 to-space-purple/20 opacity-0 group-hover:opacity-100 transition-opacity duration-500 z-0"></div>
            
            <div class="relative z-10">
                <!-- Image Container -->
                <div class="h-48 w-full overflow-hidden border-b border-white/10">
                    <img src="" alt="Project Cover" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 project-image">
                </div>
                
                <!-- Content -->
                <div class="p-6">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-2xl font-orbitron font-bold text-white group-hover:text-space-accent transition-colors project-title">Project Title</h3>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400 group-hover:text-space-accent transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                        </svg>
                    </div>
                    
                    <p class="text-gray-400 font-space mb-6 text-sm line-clamp-3 project-description">
                        Project description goes here. It provides a brief overview of the mission objectives and technologies utilized in this quadrant.
                    </p>
                    
                    <!-- Tech Stack Tags -->
                    <div class="flex flex-wrap gap-2 project-tags">
                        <!-- Tags injected here -->
                    </div>
                </div>
            </div>
        </a>
    </template>

    <script>
        // --- 1. Custom Cursor & Particles ---
        const cursor = document.getElementById('custom-cursor');
        let mouseX = 0;
        let mouseY = 0;
        let cursorX = 0;
        let cursorY = 0;
        
        // Only run cursor effects if user has a fine pointer (mouse)
        if (window.matchMedia("(pointer: fine)").matches) {
            
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                
                // Add hover effect to cursor when hovering over links
                const target = e.target;
                if (target.tagName.toLowerCase() === 'a' || target.closest('a')) {
                    cursor.style.transform = 'translate(-50%, -50%) scale(1.5)';
                } else {
                    cursor.style.transform = 'translate(-50%, -50%) scale(1)';
                }

                // Create particle trail occasionally
                if (Math.random() > 0.6) {
                    createParticle(e.clientX, e.clientY);
                }
            });

            // Smooth cursor follow animation
            function animateCursor() {
                // Easing function for smooth follow
                cursorX += (mouseX - cursorX) * 0.2;
                cursorY += (mouseY - cursorY) * 0.2;
                
                cursor.style.left = cursorX + 'px';
                cursor.style.top = cursorY + 'px';
                
                requestAnimationFrame(animateCursor);
            }
            animateCursor();

            function createParticle(x, y) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Offset particle to come from the "exhaust" of the rocket
                particle.style.left = (x + 10) + 'px';
                particle.style.top = (y + 10) + 'px';
                
                // Randomize movement direction
                const tx = (Math.random() - 0.5) * 50 + 'px';
                const ty = (Math.random() - 0.5) * 50 + 20 + 'px'; // Tend to fall downwards slightly
                
                particle.style.setProperty('--tx', tx);
                particle.style.setProperty('--ty', ty);
                
                document.body.appendChild(particle);
                
                // Clean up particle after animation
                setTimeout(() => {
                    particle.remove();
                }, 800);
            }
        }

        // --- 2. Data Fetching and Rendering ---
        
        // Fallback data in case data.json doesn't exist yet
        const fallbackData = [
            {
                "id": "1",
                "title": "Nebula E-Commerce",
                "description": "A futuristic storefront built for intergalactic trade. Features real-time inventory tracking, zero-gravity physics animations, and seamless checkout integrations.",
                "url": "#",
                "image": "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
                "tech": ["React", "Tailwind", "Node.js"]
            },
            {
                "id": "2",
                "title": "Starlight Analytics",
                "description": "A complex dashboard processing telemetry data from thousands of satellites. Utilizes WebGL for 3D data visualization and websockets for live updates.",
                "url": "#",
                "image": "https://images.unsplash.com/photo-1451187580459-43490279c0fa?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
                "tech": ["Vue.js", "Three.js", "Python"]
            },
            {
                "id": "3",
                "title": "Quasar Chat",
                "description": "End-to-end encrypted messaging application designed for deep-space communication latency. Offline-first architecture using service workers.",
                "url": "#",
                "image": "https://images.unsplash.com/photo-1506443432602-ac2fcd6f54e0?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
                "tech": ["TypeScript", "Firebase", "PWA"]
            }
        ];

        async function loadProjects() {
            const grid = document.getElementById('projects-grid');
            const loader = document.getElementById('loader');
            const template = document.getElementById('project-card-template');
            
            let projects = [];

            try {
                // Attempt to fetch from external file.
                // Replace 'data.json' with your actual path if different.
                const response = await fetch('data.json');
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                projects = await response.json();
                console.log("Successfully loaded external data.json");

            } catch (error) {
                console.log("Could not load external data.json, using fallback internal data.", error);
                // Fallback to internal data for demonstration
                projects = fallbackData;
            }

            // Simulate slight network delay for dramatic effect
            setTimeout(() => {
                loader.classList.add('hidden');
                grid.classList.remove('hidden');
                
                projects.forEach((project, index) => {
                    const clone = template.content.cloneNode(true);
                    
                    // Populate data
                    const link = clone.querySelector('a');
                    link.href = project.url || '#';
                    
                    // Add staggered animation delay
                    link.style.animationDelay = `${index * 150}ms`;
                    link.classList.add('animate-fade-in-up');

                    clone.querySelector('.project-title').textContent = project.title;
                    clone.querySelector('.project-description').textContent = project.description;
                    clone.querySelector('.project-image').src = project.image;
                    clone.querySelector('.project-image').alt = `${project.title} screenshot`;

                    // Populate tags
                    const tagsContainer = clone.querySelector('.project-tags');
                    if (project.tech && Array.isArray(project.tech)) {
                        project.tech.forEach(tech => {
                            const tag = document.createElement('span');
                            tag.className = 'px-3 py-1 text-xs font-space font-medium rounded-full bg-space-purple/20 text-space-accent border border-space-accent/30';
                            tag.textContent = tech;
                            tagsContainer.appendChild(tag);
                        });
                    }

                    grid.appendChild(clone);
                });
            }, 1000);
        }

        // --- 3. Utilities ---
        document.getElementById('year').textContent = new Date().getFullYear();

        // Add simple custom CSS animation class dynamically
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(30px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in-up {
                animation: fadeInUp 0.6s ease-out forwards;
                opacity: 0; /* Starting state */
            }
        `;
        document.head.appendChild(style);

        // Initialize
        document.addEventListener('DOMContentLoaded', loadProjects);

    </script>
